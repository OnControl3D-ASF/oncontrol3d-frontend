name: CI/CD

# Frontend delivery pipeline:
#
#   quality ─┐  lint, tsc, tests, manifests
#   secrets ─┤  gitleaks
#   sca ─────┴─▶ image ─▶ deliver dev ─▶ deliver prod
#      Trivy lockfile   build once, Trivy gates,   (approval)   (tags vX.Y.Z only, approval)
#                 SBOM, artifact
#
#   push to main  -> image sha-<commit>          -> dev
#   tag vX.Y.Z    -> images X.Y.Z, X.Y, sha-...  -> dev -> prod
#
# Path filters: documentation never triggers a service delivery.
# (GitHub does not evaluate path filters for tag pushes: releases always run.)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  secrets:
    name: Secrets
    uses: ./.github/workflows/secrets.yml

  sca:
    name: SCA
    uses: ./.github/workflows/sca.yml

  image:
    name: Build & scan image
    needs: [quality, secrets, sca]
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    outputs:
      tags: ${{ steps.version.outputs.tags }}
      app-version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute version and tags
        id: version
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not SemVer (vMAJOR.MINOR.PATCH)."
              exit 1
            fi
            echo "tags=$version ${version%.*} $sha_tag" >> "$GITHUB_OUTPUT"
            echo "app_version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$sha_tag" >> "$GITHUB_OUTPUT"
            echo "app_version=$sha_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.app_version }}" \
            -t frontend:ci .
          docker save -o frontend-image.tar frontend:ci

      # Blocking policy: CRITICAL always, HIGH when a fix exists, on the exact image that
      # will be delivered. A .trivyignore (dated exceptions) is mounted automatically.
      - name: Fail on CRITICAL vulnerabilities
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v trivy-cache:/root/.cache -w /src "$TRIVY_IMAGE"
          image --input frontend-image.tar --scanners vuln --severity CRITICAL --exit-code 1

      - name: Fail on fixable HIGH vulnerabilities
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v trivy-cache:/root/.cache -w /src "$TRIVY_IMAGE"
          image --input frontend-image.tar --scanners vuln --severity HIGH --ignore-unfixed --exit-code 1

      - name: SBOM (CycloneDX)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v trivy-cache:/root/.cache -w /src "$TRIVY_IMAGE"
          image --input frontend-image.tar --format cyclonedx --output sbom.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-image
          path: frontend-image.tar
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-sbom
          path: sbom.cdx.json

  deliver-dev:
    name: Dev
    needs: image
    # deliver.yml logs in to Azure with OIDC; a called workflow can't exceed the caller's permissions.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deliver.yml
    with:
      environment: dev
      image-tags: ${{ needs.image.outputs.tags }}
      app-version: ${{ needs.image.outputs.app-version }}

  deliver-prod:
    name: Prod
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, deliver-dev]
    # deliver.yml logs in to Azure with OIDC; a called workflow can't exceed the caller's permissions.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deliver.yml
    with:
      environment: prod
      image-tags: ${{ needs.image.outputs.tags }}
      app-version: ${{ needs.image.outputs.app-version }}
